<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yeison Andrés Murillo Ramírez | Portafolio de servicios</title>
  <meta name="description" content="Portafolio de servicios de Yeison Andrés Murillo Ramírez, desarrollador junior web y móvil.">
  <meta name="theme-color" content="#5b2c8f">
  <!-- Protección: si styles.css no carga, los iconos no se ven gigantes -->
  <style>svg{width:28px;height:28px}</style>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="pagina">

    <header class="cabecera">
      <h1 class="cabecera__titulo" id="titulo">Portafolio de servicios</h1>
      <div class="avatar" id="avatar" role="img" aria-label="Foto de perfil">YM</div>
    </header>

    <section class="perfil" aria-label="Perfil">
      <h2 class="perfil__nombre" id="nombre"></h2>
      <p class="perfil__usuario" id="usuario"></p>
    </section>

    <nav aria-label="Secciones del portafolio">
      <ul class="botones" id="listaBotones"></ul>
    </nav>

    <figure class="qr" id="qrBloque" hidden>
      <img src="qr.png" alt="Código QR para abrir este portafolio" width="120" height="120" id="qrImg">
    </figure>

    <ul class="redes" id="listaRedes" aria-label="Redes sociales y contacto"></ul>

    <section class="reporte" aria-live="polite" aria-label="Reporte de clics">
      <p>Total de clics: <strong id="totalClics">0</strong></p>
      <p>Enlace más usado: <strong id="masUsado">—</strong></p>
    </section>
  </main>

  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <dialog id="panel" class="panel" aria-labelledby="panelTitulo">
    <div class="panel__barra">
      <h2 id="panelTitulo"></h2>
      <button type="button" class="panel__cerrar" id="cerrarPanel" aria-label="Cerrar">&times;</button>
    </div>
    <div class="panel__contenido" id="panelContenido"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
